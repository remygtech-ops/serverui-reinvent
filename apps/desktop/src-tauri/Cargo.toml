[package]
name = "serverui-desktop"
version = "0.3.33"
description = "ServerUI desktop shell"
authors = ["Skyrekon Private Limited"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "serverui_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

# Native OS keychains only. Without a platform feature the keyring crate silently falls back to
# a mock store that forgets everything on exit, which made saved passwords unreadable after a
# restart. Linux uses the 0600 key file instead (no D-Bus / Secret Service dependency).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[features]
default = []
# Microsoft Store / MSIX builds: omit the GitHub updater plugin (Store owns updates).
msix-store = []

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
